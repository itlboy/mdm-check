name: Build & release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle testDebugUnitTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  device:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build first (the emulator only runs tests)
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      # A booted emulator is saved as a snapshot so later runs skip the cold boot.
      # Change the key when api-level/profile changes to build a fresh snapshot.
      - name: Emulator cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-default-pixel6-v1
      - name: Create emulator snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Emulator snapshot created for caching."
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle connectedDebugAndroidTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/

  release:
    name: Release APK
    needs: [unit, device]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the previous release tag to compare changes
      - name: Compute version (1.0, 1.1, …)
        id: ver
        run: |
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$latest" ]; then
            v="1.0"
          else
            # CI/README-only changes do not publish a new version.
            if git diff --quiet "$latest" HEAD -- app build.gradle.kts settings.gradle.kts; then
              echo "No app changes since $latest: skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor <<<"${latest#v}"
            v="$major.$((minor + 1))"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v (previous: ${latest:-none})"
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.ver.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK signed with the fixed key
        if: steps.ver.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Release build (not debuggable) draws fewer Play Protect warnings; the fixed key is mandatory.
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "::error::Missing secret SIGNING_KEYSTORE_B64"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mdm-check.p12"
          SIGNING_KEYSTORE="$RUNNER_TEMP/mdm-check.p12" gradle assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/mdm-check.p12"
      - name: Create release
        if: steps.ver.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "cozy-mdm-check-$APP_VERSION.apk"
          gh release create "v$APP_VERSION" "cozy-mdm-check-$APP_VERSION.apk" \
            --title "Cozy MDM Check $APP_VERSION" \
            --notes "Test build from commit ${GITHUB_SHA::7}. Download the .apk below on an Android phone and open it to install."
